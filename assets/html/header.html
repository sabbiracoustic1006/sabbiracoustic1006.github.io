<!-- Header for the older Bootstrap pages (blog posts, Ms. Pac-Man page).
     Those pages load this file with jQuery. The new pages have the same header written in place. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="/assets/styles/site.css">

<div class="sa-header">
    <div class="sa-wrap">
        <a class="sa-brand" href="/">Sabbir Ahmed</a>
        <nav class="sa-nav" aria-label="Main">
            <a href="/publications/" id="sa-nav-research">Research</a>
            <a href="/projects/" id="sa-nav-projects">Projects</a>
            <a href="/blogs/" id="sa-nav-writing">Writing</a>
            <a href="/assets/cv/Sabbir_CV.pdf">CV</a>
            <a href="mailto:sahmed9@binghamton.edu">Contact</a>
        </nav>
    </div>
</div>

<script>
    // Mark the page as an older page, so site.css can match its fonts and colours.
    document.body.classList.add('sa-legacy');

    // Underline the menu item of the section we are in.
    var saPath = window.location.pathname;
    var saActive = null;
    if (saPath.indexOf('/projects/') === 0) { saActive = 'sa-nav-projects'; }
    if (saPath.indexOf('/blogs/') === 0) { saActive = 'sa-nav-writing'; }
    if (saPath.indexOf('/publications/') === 0) { saActive = 'sa-nav-research'; }
    if (saActive) { document.getElementById(saActive).setAttribute('aria-current', 'page'); }

    // Small icon in the browser tab.
    if (!document.querySelector('link[rel="icon"]')) {
        var saIcon = document.createElement('link');
        saIcon.rel = 'icon';
        saIcon.type = 'image/svg+xml';
        saIcon.href = '/favicon.svg';
        document.head.appendChild(saIcon);
    }
</script>
